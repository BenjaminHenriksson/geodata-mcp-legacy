[project]
name = "geodata-mcp"
version = "0.1.0"
description = "MCP server for Swedish open geodata (Stockholm)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "pydantic>=2.0",
    "sqlglot>=25.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "shapely>=2.0",
    "markdown>=3.5",
    "pyproj>=3.6",
]

[project.optional-dependencies]
preprocess = [
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geodata_mcp"]

[tool.ruff]
line-length = 100

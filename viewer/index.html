<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F5F0E8" />
<title>Geodata viewer</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory:      #F5F0E8;
    --paper:      #EDE7D9;
    --ink:        #1C1A16;
    --ink-mid:    #4A4540;
    --ink-faint:  #9A9188;
    --terra:      #B05B3B;
    --rule:       rgba(28,26,22,0.16);
    --rule-soft:  rgba(28,26,22,0.08);
    --panel-bg:   rgba(245,240,232,0.94);
    --panel-hover:rgba(237,231,217,0.96);
    --serif:      'Cormorant Garamond', Georgia, serif;
    --sans:       'DM Sans', system-ui, sans-serif;
    --mono:       'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

  .panel {
    position: absolute;
    z-index: 10;
    background: var(--panel-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--rule);
    box-shadow: 0 6px 18px -4px rgba(28,26,22,0.14);
    padding: 16px 18px;
    border-radius: 3px;
    color: var(--ink);
  }

  #panel-layers {
    top: 16px;
    left: 16px;
    width: 320px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
  }

  #panel-settings {
    bottom: 30px;
    left: 16px;
    width: 320px;
    max-width: calc(100vw - 32px);
  }

  .viewer-eyebrow {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--terra);
    margin-bottom: 0.35rem;
    font-weight: 400;
  }
  .viewer-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--ink);
    margin: 0 0 0.75rem 0;
  }

  #status {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
    padding: 0.55rem 0;
    margin-bottom: 0.4rem;
    font-variant-numeric: tabular-nums;
  }

  #layers {
    overflow-y: auto;
    margin-right: -4px;
    padding-right: 4px;
  }
  #layers::-webkit-scrollbar { width: 6px; }
  #layers::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

  .layer-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .layer-row:last-child { border-bottom: none; }
  .layer-row input[type=checkbox] {
    margin-top: 3px;
    accent-color: var(--terra);
    cursor: pointer;
  }
  .layer-row label {
    flex: 1;
    cursor: pointer;
    min-width: 0;
  }
  .layer-name {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.2;
  }
  .layer-swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(28,26,22,0.18);
  }
  .meta {
    color: var(--ink-faint);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.3rem;
    font-variant-numeric: tabular-nums;
  }
  .meta-note {
    margin-top: 0.3rem;
    color: var(--ink-mid);
    font-size: 12px;
    font-style: italic;
    line-height: 1.45;
  }

  /* Legend — per-layer style readout */
  .legend {
    margin-top: 0.55rem;
    padding-top: 0.5rem;
    border-top: 1px dotted var(--rule-soft);
  }
  .legend-col-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--terra);
    margin-bottom: 0.35rem;
  }
  .legend-cats {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
  }
  .legend-cats li {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-mid);
    line-height: 1.4;
    min-width: 0;
  }
  .legend-cats .legend-val {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(28,26,22,0.18);
  }
  .legend-more {
    font-size: 10px;
    color: var(--ink-faint);
    font-style: italic;
    grid-column: 1 / -1;
  }
  .legend-gradient {
    height: 8px;
    border: 1px solid var(--rule-soft);
    margin-bottom: 0.25rem;
  }
  .legend-range {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .legend-channel {
    margin-top: 0.4rem;
    display: flex;
    gap: 8px;
    font-size: 11px;
    color: var(--ink-mid);
    align-items: baseline;
  }
  .legend-channel-key {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--terra);
    flex-shrink: 0;
    min-width: 4.5rem;
  }
  .legend-channel-val { color: var(--ink); }
  .legend-channel-range {
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    margin-left: 0.4rem;
  }

  /* Column attribution — distinguishes in-session-authored columns */
  .authored {
    margin-top: 0.5rem;
    padding-top: 0.4rem;
    border-top: 1px dotted var(--rule-soft);
    font-size: 10px;
    color: var(--ink-mid);
    line-height: 1.45;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .auth-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .auth-llm { background: var(--terra); }
  .auth-derived { background: #6B7348; }

  a { color: var(--terra); text-decoration: none; }
  a:hover { text-decoration: underline; }

  details summary {
    cursor: pointer;
    color: var(--terra);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.2rem 0;
    font-weight: 400;
    user-select: none;
  }
  details summary::marker { content: ''; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before {
    content: '+ ';
    font-family: var(--mono);
    font-size: 11px;
    color: var(--terra);
  }
  details[open] summary::before { content: '– '; }

  .settings-body { margin-top: 0.8rem; }
  .settings-hint {
    font-size: 11px;
    color: var(--ink-mid);
    line-height: 1.5;
    margin-bottom: 0.5rem;
  }
  .settings-hint code {
    font-family: var(--mono);
    font-size: 10px;
    background: var(--paper);
    padding: 1px 4px;
    border: 1px solid var(--rule-soft);
    word-break: break-all;
  }

  input[type=text] {
    width: 100%;
    padding: 6px 8px;
    background: var(--ivory);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 11px;
  }
  input[type=text]:focus { outline: none; border-color: var(--terra); }

  button {
    background: var(--ink);
    color: var(--ivory);
    border: none;
    border-radius: 2px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    margin-right: 0.4rem;
    transition: background 0.15s;
  }
  button:hover { background: var(--terra); }
  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  button.secondary:hover {
    background: transparent;
    color: var(--terra);
    border-color: var(--terra);
  }

  .feature-popup {
    background: var(--ivory);
    color: var(--ink);
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.5;
    max-width: 320px;
    box-shadow: 0 8px 24px -6px rgba(28,26,22,0.18);
  }
  .feature-popup .popup-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.15;
    margin-bottom: 0.55rem;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .feature-popup .popup-title .layer-swatch { align-self: center; }
  .feature-popup .row {
    display: grid;
    grid-template-columns: minmax(5.5rem, auto) 1fr;
    gap: 10px;
    padding: 3px 0;
    border-bottom: 1px dotted var(--rule-soft);
  }
  .feature-popup .row:last-of-type { border-bottom: none; }
  .feature-popup .k {
    color: var(--terra);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .feature-popup .v {
    word-break: break-word;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .feature-popup .meta {
    margin-top: 0.55rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--rule-soft);
  }

  /* MapLibre popup close button + tip restyle to match paper palette. */
  .maplibregl-popup-content {
    background: transparent !important;
    padding: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }
  .maplibregl-popup-tip { border-top-color: var(--ivory) !important; }
  .maplibregl-popup-close-button {
    color: var(--ink-faint) !important;
    font-size: 18px !important;
    padding: 2px 8px !important;
  }
  .maplibregl-popup-close-button:hover {
    background: transparent !important;
    color: var(--terra) !important;
  }

  /* Restyle MapLibre's navigation + scale controls so they sit in the
     same paper palette. */
  .maplibregl-ctrl-group {
    background: var(--panel-bg) !important;
    border: 1px solid var(--rule) !important;
    box-shadow: 0 2px 6px rgba(28,26,22,0.08) !important;
    border-radius: 2px !important;
  }
  .maplibregl-ctrl-group button { color: var(--ink) !important; margin: 0 !important; }
  .maplibregl-ctrl-scale {
    background: var(--panel-bg) !important;
    border-color: var(--ink-faint) !important;
    color: var(--ink) !important;
    font-family: var(--sans) !important;
    font-size: 10px !important;
    letter-spacing: 0.08em !important;
    text-transform: uppercase !important;
    padding: 2px 6px !important;
  }

  @media (max-width: 720px) {
    #panel-layers {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: auto;
      max-width: none;
      max-height: 45vh;
      border-radius: 3px 3px 0 0;
      border-bottom: none;
    }
    #panel-settings {
      top: 16px;
      bottom: auto;
      left: 16px;
      right: 16px;
      width: auto;
    }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel-layers" class="panel">
  <div class="viewer-eyebrow">Geodata MCP · Session</div>
  <h1 class="viewer-title" id="viewer-title">Geodata viewer</h1>
  <div id="status">Loading session…</div>
  <div id="layers"></div>
</div>

<div id="panel-settings" class="panel">
  <details>
    <summary>Basemap</summary>
    <div class="settings-body">
      <p class="settings-hint">
        Default is Carto Positron (light). Paste a MapTiler or Mapbox style URL
        to override, e.g. <code>https://api.maptiler.com/maps/streets-v2/style.json?key=YOUR_KEY</code>.
      </p>
      <input id="basemap-input" type="text" placeholder="Leave blank for default"/>
      <button id="basemap-apply">Apply</button>
      <button id="basemap-reset" class="secondary">Reset</button>
    </div>
  </details>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js?v={APP_JS_HASH}"></script>
</body>
</html>
